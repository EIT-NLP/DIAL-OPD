<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">DIAL-OPD: Learning More from Fewer Tokens in On-Policy Distillation</title>
  <desc id="desc">A light blue research banner with a dial representing tunable probability weighting.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#f1f9fe"/><stop offset="1" stop-color="#e2f1fb"/></linearGradient>
    <linearGradient id="arc"><stop stop-color="#a795c5"/><stop offset=".5" stop-color="#72b3d8"/><stop offset="1" stop-color="#2879af"/></linearGradient>
  </defs>
  <rect width="1200" height="290" rx="18" fill="url(#background)"/>
