    <g stroke="#688ba5" stroke-width="2"><path d="M-78 45l-8 4M-90 0h-9M-78-45l-8-4M-45-78l-4-8M0-90v-9M45-78l4-8M78-45l8-4M90 0h9M78 45l8 4"/></g>
